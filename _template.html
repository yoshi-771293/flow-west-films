<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- Root base: assets, scripts and CSS are relative; /blog/<slug> is two levels deep and must still resolve them from the site root. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Werbefilm & Ad Creative Produktion Stuttgart — Flow West Films</title>
  <meta name="description" content="Werbefilme, Ad Creatives &amp; cinematische Filmproduktion für Mittelstandsmarken, die skalieren wollen. Studio in Stuttgart, Einsatz in ganz DACH." />
  <link rel="icon" type="image/png" href="assets/fwf-lion.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="Werbefilm & Ad Creative Produktion Stuttgart — Flow West Films" />
  <meta property="og:description" content="Werbefilme, Ad Creatives &amp; cinematische Filmproduktion für Mittelstandsmarken. Studio in Stuttgart." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://flowwestfilms.de/" />
  <meta property="og:image" content="https://flowwestfilms.de/assets/fwf-lockup.png" />
  <meta property="og:locale" content="de_DE" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css?v=65" />

  <!-- Responsive overrides -->
  <style>
    @media (max-width: 980px) {
      .fwf-offers-grid { grid-template-columns: 1fr !important; }
      .fwf-proj-grid { grid-template-columns: 1fr 1fr !important; }
      .fwf-featured-grid { grid-template-columns: 1fr !important; }
      .fwf-grid-collapse { grid-template-columns: 1fr !important; gap: 48px !important; }
      .fwf-why-grid { grid-template-columns: 1fr 1fr !important; }
      .fwf-why-grid > div { border-right: none !important; border-bottom: 1px solid var(--fwf-hairline); }
      .fwf-why-grid > div:nth-child(odd) { border-right: 1px solid var(--fwf-hairline) !important; }
      .fwf-pillars { grid-template-columns: 1fr 1fr !important; }
      .fwf-form-row { grid-template-columns: 1fr !important; }
      .fwf-contact-photo { min-height: 400px !important; }
    }
    @media (max-width: 640px) {
      .fwf-proj-grid { grid-template-columns: 1fr !important; }
      .fwf-pillars { grid-template-columns: 1fr !important; }
      .fwf-why-grid { grid-template-columns: 1fr !important; }
      .fwf-why-grid > div { border-right: none !important; }
      .fwf-nav-inner { padding: 14px 20px !important; }
      .fwf-nav-wordmark { display: none; }
    }

    /* Fix: styles.css targets #app, React mounts to #root */
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    #root > #app { flex: 1; display: flex; flex-direction: column; }

    @media (prefers-reduced-motion: reduce) {
      .fwf-marquee-track { animation: none !important; }
      .fwf-fade-up, .fwf-d1, .fwf-d2, .fwf-d3, .fwf-d4, .fwf-d5 { animation: none !important; opacity: 1 !important; }
      .fwf-pulse { animation: none !important; }
    }
  </style>

  <!-- German overlay (i18n) — anti-flash: hide app until first DE pass (EN visitors unaffected) -->
  <script>
    (function () {
      try {
        var l = localStorage.getItem("fwf-lang");
        if (l === null) {
          var nl = (navigator.language || navigator.userLanguage || "").toLowerCase();
          l = nl.startsWith("de") ? "de" : "en";
        }
        if (l !== "en") {
          document.documentElement.className += " fwf-i18n-boot";
          setTimeout(function () { document.documentElement.classList.remove("fwf-i18n-boot"); }, 1600);
        }
      } catch (e) {}
    })();
  </script>
  <style>html.fwf-i18n-boot #root { visibility: hidden; }</style>
  <script src="i18n/translations.js?v=95"></script>
  <script src="blog-data.js?v=1"></script>
  <script src="i18n/i18n.js?v=78"></script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="font-family:sans-serif;text-align:center;padding:80px 24px;color:#fff;background:#0a0a0a">
      <h1>Flow West Films</h1>
      <p>Please enable JavaScript to view this site.</p>
    </div>
  </noscript>

  <!-- React + Babel (CDN) — integrity hashes lock to exact file content (SRI).
       defer on all of these (kept in dependency order, which defer preserves)
       so the browser can paint the hero/CSS immediately instead of blocking
       HTML parsing on ~7 sequential third-party downloads first. -->
  <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
  <script defer src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>

  <!-- 3D + animation libs (used only by the Projects page; inert until that route mounts) -->
  <script defer src="https://unpkg.com/three@0.128.0/build/three.min.js" crossorigin="anonymous" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu"></script>
  <script defer src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js" crossorigin="anonymous" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt"></script>
  <script defer src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js" crossorigin="anonymous" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d"></script>
  <script defer src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js" crossorigin="anonymous" integrity="sha384-li4UtcFCH6QeUqR4JyV58/VgTprMuz9aauj+oWtew7V4Y7ZVjnvz5px9Y3UCG0Ea"></script>

  <!-- HLS.js — real adaptive bitrate now (see shared.jsx/home.jsx), so this just decodes the manifest -->
  <script defer src="https://unpkg.com/hls.js@1.5.17/dist/hls.min.js" crossorigin="anonymous" integrity="sha384-9v3HcdYrO3D+OPDTjZ40RXocgE4GtXVCd3/mCS62JsM93JXgI1afJVuwjFvsu6ni"></script>

  <!-- Mobile motion layer (plain JS — executes before the Babel-compiled components) -->
  <script defer src="fx.js?v=3"></script>

  <!-- Components — order matters: shared → home → pages → tweaks → app.
       type="text/babel" scripts are already inert to native execution (Babel's
       runtime scans for them on DOMContentLoaded), so defer here just keeps
       them consistent with the loader chain above; it isn't load-bearing. -->
  <script defer type="text/babel" src="shared.jsx?v=81"></script>
  <script defer type="text/babel" src="home.jsx?v=95"></script>
  <script defer type="text/babel" src="pages.jsx?v=97"></script>
  <script defer type="text/babel" src="blog.jsx?v=3"></script>
  <script defer type="text/babel" src="tweaks-panel.jsx?v=77"></script>
  <script defer type="text/babel" src="app.jsx?v=77"></script>

  <!-- Meta Pixel (3457088161112221) — loads ONLY after opt-in consent (DSGVO/TTDSG), as promised on /datenschutz.
       Choice is stored in localStorage; "Cookie-Einstellungen" in the footer reopens the banner (withdrawal).
       Events: PageView on load + every in-app route change, Lead on Calendly clicks, Contact on mailto/tel clicks. -->
  <script>
  (function () {
    var PIXEL_ID = "3457088161112221";
    var KEY = "fwf-consent-v1";
    var loaded = false;
    function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function write(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function loadPixel() {
      if (loaded) { if (window.fbq) window.fbq("consent", "grant"); return; }
      loaded = true;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
      window.fbq("init", PIXEL_ID);
      window.fbq("track", "PageView");
    }
    function track(ev, params) { if (loaded && window.fbq && read() === "granted") window.fbq("track", ev, params || {}); }

    // In-app navigation (Link -> history.pushState + "fwf-navigate"; back/forward -> popstate)
    var lastPath = location.pathname;
    function onNav() { setTimeout(function () { if (location.pathname !== lastPath) { lastPath = location.pathname; track("PageView"); } }, 0); }
    window.addEventListener("fwf-navigate", onNav);
    window.addEventListener("popstate", onNav);

    document.addEventListener("click", function (e) {
      var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
      if (!a) return;
      var h = a.getAttribute("href") || "";
      if (h.indexOf("calendly.com") !== -1) track("Lead", { content_name: "Strategy call (Calendly)" });
      else if (h.indexOf("mailto:") === 0 || h.indexOf("tel:") === 0) track("Contact");
    }, true);

    var TEXT = {
      de: { msg: "Wir nutzen den Meta Pixel, um zu messen, wie unsere Werbung wirkt — nur mit Ihrer Einwilligung, die Sie jederzeit widerrufen können.", more: "Datenschutz", yes: "Akzeptieren", no: "Ablehnen" },
      en: { msg: "We use the Meta Pixel to measure how our ads perform — only with your consent, which you can withdraw at any time.", more: "Privacy policy", yes: "Accept", no: "Decline" }
    };
    var box = null;
    function lang() { return (window.FWF_getLanguage && window.FWF_getLanguage()) === "en" ? "en" : "de"; }
    function fill() {
      if (!box) return;
      var t = TEXT[lang()];
      box.querySelector("[data-c=msg]").textContent = t.msg + " ";
      box.querySelector("[data-c=more]").textContent = t.more;
      box.querySelector("[data-c=yes]").textContent = t.yes;
      box.querySelector("[data-c=no]").textContent = t.no;
    }
    function hide() { if (box) { box.remove(); box = null; } }
    function choose(v) {
      write(v);
      hide();
      if (v === "granted") loadPixel();
      else if (loaded && window.fbq) window.fbq("consent", "revoke");
    }
    function show() {
      if (box) return;
      box = document.createElement("div");
      box.id = "fwf-consent";
      box.setAttribute("role", "dialog");
      box.setAttribute("aria-label", "Cookie consent");
      box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;max-width:520px;z-index:2147483000;background:rgba(14,14,16,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px 22px;color:rgba(255,255,255,0.88);font-size:14px;line-height:1.55;box-shadow:0 18px 50px -18px rgba(0,0,0,0.8)";
      box.innerHTML =
        '<p style="margin:0 0 16px 0"><span data-c="msg"></span><a data-c="more" href="/datenschutz" style="color:var(--fwf-pink, #ff2d78);text-decoration:underline"></a></p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button type="button" data-c="no" class="fwf-btn fwf-btn-ghost fwf-btn-sm"></button>' +
          '<button type="button" data-c="yes" class="fwf-btn fwf-btn-ghost fwf-btn-sm"></button>' +
        '</div>';
      box.querySelector("[data-c=no]").addEventListener("click", function () { choose("denied"); });
      box.querySelector("[data-c=yes]").addEventListener("click", function () { choose("granted"); });
      document.body.appendChild(box);
      fill();
    }
    window.addEventListener("fwf-lang-change", fill);
    window.FWF_consent = { open: show, get: read };

    var c = read();
    if (c === "granted") loadPixel();
    else if (c !== "denied") {
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show); else show();
    }
  })();
  </script>

  <!-- Vercel Web Analytics — static-site script tag (no build step, so no @vercel/analytics package) -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
